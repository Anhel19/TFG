services:
  - type: web
    name: truetable-backend
    runtime: python
    plan: free
    buildCommand: "./tfg-backend/build.sh"
    startCommand: "cd tfg-backend && gunicorn core.wsgi:application"
    rootDir: .
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://localhost"
      - key: DATABASE_URL
        fromDatabase:
          name: truetable-db
          property: connectionString

databases:
  - name: truetable-db
    plan: free
    databaseName: truetable
    user: truetable